<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Домашнее задание 21.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css//bootstrap.min.css" rel="stylesheet"/>
    <script src="js/bootstrap.bundle.min.js"></script>
    <style>
        .min-vh-80 {
            min-height: 80vh;
        }
        .dark-btn {
            background-color: #343a40;
            border-color: #343a40;
            color: white;
        }
        .dark-btn:hover {
            background-color: #23272b;
            border-color: #23272b;
            color: white;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container-fluid flex-grow-1">
    <div class="row min-vh-100">
        <!-- ТЕМНЫЙ СТОЛБИК С МЕНЮ -->
        <div class="col-2 d-flex flex-column bg-dark text-white p-3">
            <div>
                <h4 class="text-white">Меню</h4>
                <hr class="text-white">
                <div class="btn-group-vertical w-100" role="group">
                    <!-- Кнопки такого же цвета как фон -->
                    <a href="index.html" type="button" class="btn dark-btn mb-2">Главная</a>
                    <a href="category.html" type="button" class="btn dark-btn mb-2">Категория</a>
                    <a href="orders.html" type="button" class="btn dark-btn mb-2">Заказы</a>
                    <a href="contacts.html" type="button" class="btn dark-btn mb-2">Контакты</a>
                </div>
            </div>


            <!-- Кнопка пользователя внизу -->
            <div class="mt-auto pt-3">
                <hr class="text-white">
                <div class="btn-group dropup w-100" role="group">
                    <button type="button" class="btn dark-btn dropdown-toggle w-100" data-bs-toggle="dropdown">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="index.html">Профиль</a></li>
                        <li><a class="dropdown-item" href="contacts.html">Выход</a></li>
                    </ul>
                </div>

        </div>


        <div class="col-1 d-flex flex-column"></div>


        <div class="col-8">
            <!-- остальной контент без изменений -->
            <br>
            <br>
            <h1 class="text-center">Контакты</h1>


            <br>
            <br>
            <div class="row g-5">
                <div class="col-12 col-md-5 card">


                    <label for="exampleFormControlInput1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1"
                           placeholder="name@example.com">


                    <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    <br>
                    <button type="button" class="btn btn-primary">Отправить</button>
                    <br>
                </div>

                <div class="col-1"></div>

                <div class="col-12 col-md-5">
                    <br>
                    <h4 class="text-start">Наши контакты.</h4>
                    <p>Здесь перечисляется всякая полезная информация для посетителей сайта</p>
                </div>
            </div>


        </div>
    </div>

</html>
